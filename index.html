<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC Callbot Client</title>
  <link rel="stylesheet" href="style.css" id="mainStyle" />
  <script>document.getElementById('mainStyle').href = `style.css?v=${Date.now()}`;</script>
  <script src="https://cdn.jsdelivr.net/npm/jssip@3/dist/jssip.min.js"></script>
</head>
<body>
  <main>
    <h1>WebRTC Callbot</h1>

    <section class="status">
      <span class="badge" id="statusBadge" data-state="disconnected">Disconnected</span>
      <span class="meta" id="statusMeta"></span>
    </section>

    <section class="controls">
      <button id="callBtn">Call 2001</button>
      <button id="hangupBtn" disabled>Hang up</button>
    </section>

    <section class="chat" id="chat" aria-label="대화 내역"></section>

    <section class="say">
      <input
        id="textInput"
        type="text"
        placeholder="콜봇에게 보낼 문장 입력 후 Send (통화 중일 때만 활성)"
        disabled
      />
      <button id="sendBtn" disabled>Send</button>
    </section>

    <section class="multi-say">
      <div class="multi-header">
        <h3 class="multi-title">멀티 질의 — 적용 시 봇 답변에 맞춰 순차 송신</h3>
        <span class="multi-hint" id="multiHint"></span>
      </div>
      <div class="multi-rows" id="multiRows"></div>
      <div class="multi-actions">
        <button id="addRowBtn" type="button" class="secondary" disabled>+ 행 추가</button>
        <button id="applyAllBtn" disabled>적용</button>
      </div>
    </section>

    <audio id="remoteAudio" autoplay playsinline></audio>

    <details class="log-details">
      <summary>Log</summary>
      <pre id="log"></pre>
    </details>
  </main>

  <script>
    // 개발 중 캐시 무력화. 운영에서는 빌드 hash 로 교체.
    document.write(`<script src="config.js?v=${Date.now()}"><\/script>`);
    document.write(`<script src="samples.js?v=${Date.now()}"><\/script>`);
    document.write(`<script src="app.js?v=${Date.now()}"><\/script>`);
  </script>
</body>
</html>
